# =============================================================================
# outreach-copilot — campaign config (shell-sourceable; rendered with envsubst)
# Copy this to  campaigns/<slug>.conf  and edit. Your real config is gitignored.
# After editing, run:  scripts/render.sh <slug>   then   scripts/install.sh <slug>
# =============================================================================

# ---- Identity ----
CAMPAIGN_NAME="EB-5 rural-route counsel search"     # human label, used in emails
CAMPAIGN_SLUG="eb5-lawyers"                          # kebab-case; names files/labels/jobs
GOOGLE_ACCOUNT="you@gmail.com"                       # the Gmail/Drive/Calendar account (workspace-mcp)

# ---- Tracker (SPREADSHEET_ID is filled in by setup once the sheet is created) ----
SPREADSHEET_ID=""
PROSPECT_TAB="Prospects"                             # tab name for the prospect list

# ---- Your outreach (fill AFTER you send your BCC outreach email) ----
# Replies thread back to this. Find the thread id + RFC Message-ID in your Sent mail.
OUTREACH_SUBJECT="EB-5 rural set-aside — prospective investor seeking counsel; intro call?"
OUTREACH_THREAD_ID=""                                # Gmail thread id of your outreach
OUTREACH_RFC_MSGID=""                                # <...@mail.gmail.com> — used to thread replies
# Space-separated domains of your prospects, so the sweep recognizes their replies:
PROSPECT_DOMAINS="firm-a.com firm-b.com firm-c.example"

# ---- Dedup (do not change after first run; deleting it re-processes everything) ----
DEDUP_LABEL="outreach-copilot/eb5-lawyers/processed"

# ---- Persona & draft rules (this is the voice of your replies) ----
SENDER_NAME="Your Name"
SENDER_EMAIL="you@gmail.com"
SIGNATURE="Best regards,\nYour Name\nyou@gmail.com"
DRAFT_TONE="professional, warm, concise; 4-9 sentences; no marketing fluff"
PHONE_DISCRETION="true"        # true = never put your phone in replies; schedule by email only
DISCLOSE_COMPARISON="true"     # true = OK to acknowledge you're evaluating several providers
# One short paragraph of context the recipient should have about you / your ask:
PERSONA="I'm an India-born, U.S.-resident professional exploring the EB-5 rural set-aside route. I have not selected a project and want independent counsel. Net worth is sufficient to fund the investment from U.S.-sourced assets."

# ---- What to extract from each reply (max 4; these become tracker columns J-M) ----
EXTRACTION_TOPICS="Engagement model / who handles the case day-to-day
Fee structure: what's included across stages vs billed separately
Due-diligence support and how they keep it independent
Relevant experience (your specific situation)"

# ---- Call scheduling (calendar-aware: only proposes free slots; books on confirm) ----
# Needs the Google Calendar API enabled + calendar READ+WRITE scope granted. See docs/CALENDAR.md.
# Set to "false" to disable calendar reads/writes entirely.
SCHEDULING_ENABLED="true"
CALENDAR_ID="primary"
CALL_TIMEZONE="America/New_York"
CALL_WINDOW="weekdays, roughly 9:00am-5:00pm ET (avoid before 8am / after 6pm; no weekends)"
CALL_DURATION_MIN="30"

# ---- Notifications ----  (full guide: docs/NOTIFICATIONS.md)
# You ALWAYS get an email digest in your own inbox (your durable record).
# NOTIFY_CHANNEL adds an optional INSTANT ping on top:
#   email    = digest email only, no extra ping  (nothing else to set up)
#   imessage = also text you      (macOS only; set IMESSAGE_RECIPIENT + grant Automation permission)
#   slack    = also post to Slack (set SLACK_WEBHOOK_URL to an Incoming Webhook)
#   none     = no instant ping    (you still get the email digest)
NOTIFY_CHANNEL="email"
IMESSAGE_RECIPIENT=""          # "+15551234567" — your own number/Apple ID; only used by imessage
SLACK_WEBHOOK_URL=""           # Slack Incoming Webhook URL; only used by slack

# ---- Schedule (local time) — set how often BOTH jobs run ----
# Reply-sweep frequency. 24 = once daily (at SWEEP_HOUR:SWEEP_MIN below);
# any value < 24 = every N hours (e.g. 6 = four times a day). 1 = hourly.
SWEEP_INTERVAL_HOURS="24"
SWEEP_HOUR="6"                 # anchor time of day, used when SWEEP_INTERVAL_HOURS=24
SWEEP_MIN="15"
# Sender frequency (how often approved drafts are sent). e.g. 3 = every 3 hours.
SENDER_INTERVAL_HOURS="3"

# ---- Runtime ----
CLAUDE_BIN="$HOME/.local/bin/claude"
